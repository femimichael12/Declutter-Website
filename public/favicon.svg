<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Dark Navy Squircle Background -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Border for Contrast -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- High-contrast Shopping Bag Group -->
  <g transform="translate(32,32.5) scale(1.85) translate(-12,-12)">
    <!-- Bag Body (Lucide ShoppingBag Path) -->
    <path
      d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"
      fill="none"
      stroke="url(#bagGrad)"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Bag Horizontal Seam -->
    <path
      d="M3 6h18"
      stroke="#60A5FA"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Bag Handle Arch (Vibrant Emerald Accent) -->
    <path
      d="M16 10a4 4 0 0 1-8 0"
      fill="none"
      stroke="#10B981"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>